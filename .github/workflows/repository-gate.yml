name: Repository gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: repository-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@latest
        with:
          persist-credentials: false

      - name: Verify checkout credentials are not persisted
        run: |
          if git config --local --get-regexp '^http\..*\.extraheader$'; then
            echo "Checkout persisted a Git credential extraheader." >&2
            exit 1
          fi

      - uses: pnpm/setup@latest
        with:
          version: 11.24.0

      - uses: actions/setup-node@latest
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run check

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@latest
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
